name: Boost Context native Windows ARM64
on:
  push:
    branches: [codex/boost-context-arm64-probe]
permissions:
  contents: read
jobs:
  context:
    if: github.repository == 'ClayWarren/boost-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Retrieve verified Boost source
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 2 https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2 --output boost.tar.bz2
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          if ((Get-FileHash boost.tar.bz2 -Algorithm SHA256).Hash.ToLower() -ne '5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c') { throw 'Source checksum mismatch' }
          tar -xf boost.tar.bz2
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
      - name: Build Context, Coroutine and Fiber and exercise context switching
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS_ROOT=%%i"
          call "%VS_ROOT%\VC\Auxiliary\Build\vcvarsall.bat" arm64
          if errorlevel 1 exit /b 1
          cd boost_1_92_0
          git apply "%GITHUB_WORKSPACE%\recipe\patches\0002-use-arm64-fcontext-assembly.patch"
          if errorlevel 1 exit /b 1
          call bootstrap.bat
          if errorlevel 1 exit /b 1
          b2 -j4 --with-context --with-coroutine --with-fiber toolset=msvc address-model=64 architecture=arm link=shared threading=multi variant=release cxxstd=20 --layout=system --prefix=C:\boost-context-install install
          if errorlevel 1 exit /b 1
          set "PATH=C:\boost-context-install\bin;%PATH%"
          cl /EHsc /MD /std:c++20 /DBOOST_ALL_DYN_LINK /DBOOST_ALL_NO_LIB /IC:\boost-context-install\include "%GITHUB_WORKSPACE%\recipe\test\test_context_coroutine.cpp" /link /libpath:C:\boost-context-install\lib boost_context.lib boost_coroutine.lib
          if errorlevel 1 exit /b 1
          test_context_coroutine.exe
          if errorlevel 1 exit /b 1
          dumpbin /headers C:\boost-context-install\bin\boost_context.dll | findstr /I /C:"AA64 machine (ARM64)"
          if errorlevel 1 exit /b 1
          dumpbin /headers C:\boost-context-install\bin\boost_fiber.dll | findstr /I /C:"AA64 machine (ARM64)"
          if errorlevel 1 exit /b 1
          dumpbin /headers test_context_coroutine.exe | findstr /I /C:"AA64 machine (ARM64)"
          if errorlevel 1 exit /b 1

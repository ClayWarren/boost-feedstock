name: Boost Hana native Windows ARM64
on:
  push:
    branches: [codex/boost-hana-arm64-probe]
permissions:
  contents: read
jobs:
  context:
    if: github.repository == 'ClayWarren/boost-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Retrieve verified Boost source
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 2 https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2 --output boost.tar.bz2
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          if ((Get-FileHash boost.tar.bz2 -Algorithm SHA256).Hash.ToLower() -ne '5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c') { throw 'Source checksum mismatch' }
          tar -xf boost.tar.bz2
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
      - name: Compile and run large Hana consumer with conforming preprocessor
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS_ROOT=%%i"
          call "%VS_ROOT%\VC\Auxiliary\Build\vcvarsall.bat" arm64
          if errorlevel 1 exit /b 1
          cd boost_1_92_0
          python "%GITHUB_WORKSPACE%\recipe\render_hana.py" boost\hana\detail\struct_macros.hpp.erb boost\hana\detail\struct_macros.hpp --members 200
          if errorlevel 1 exit /b 1
          cl /EHsc /MD /std:c++20 /Zc:preprocessor /I. "%GITHUB_WORKSPACE%\recipe\test\test_hana_large.cpp"
          if errorlevel 1 exit /b 1
          test_hana_large.exe
          if errorlevel 1 exit /b 1
          dumpbin /headers test_hana_large.exe | findstr /I /C:"AA64 machine (ARM64)"
          if errorlevel 1 exit /b 1
